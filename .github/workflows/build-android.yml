name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-virtualenv autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev automake autopoint gettext cargo rustc

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer cython==0.29.34

      - name: Build APK
        working-directory: android_app
        run: buildozer -v android debug

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: everyday-calculator-apk
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14

